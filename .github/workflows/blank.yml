name: Flutter CI

on:
  push:
    branches: [main, arena/bf79af63-altin-hesaplama]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform dosyalarını doğrula
        run: flutter create --platforms=android,ios --org com.cemilkorkmaz .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: iOS proje dosyalarını doğrula
        run: flutter create --platforms=ios --org com.cemilkorkmaz .
      - run: flutter pub get
      - name: iOS derlemesi (imzasız)
        run: flutter build ios --release --no-codesign
