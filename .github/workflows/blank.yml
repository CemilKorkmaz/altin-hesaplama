name: Flutter CI

on:
  push:
    branches: [main, arena/bf79af63-altin-hesaplama, arena/26e12ef2-altin-hesaplama]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform dosyalarını doğrula
        run: |
          set +e
          flutter create --platforms=android,ios --org com.cemilkorkmaz . > create.log 2>&1
          status=$?
          cat create.log
          if [ $status -ne 0 ]; then
            python3 -c 'from pathlib import Path; text=Path("create.log").read_text(); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit $status
      - run: flutter pub get
      - name: Flutter analiz
        run: |
          set +e
          flutter analyze > analysis.log 2>&1
          status=$?
          cat analysis.log
          printf '```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat analysis.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            python3 -c 'from pathlib import Path; text=Path("analysis.log").read_text(); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit $status
      - name: Flutter testleri
        run: |
          set +e
          flutter test --coverage > test.log 2>&1
          status=$?
          cat test.log
          printf '```text\n' >> "$GITHUB_STEP_SUMMARY"
          tail -150 test.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            python3 -c 'from pathlib import Path; text=Path("test.log").read_text(); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit $status

  android-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android proje dosyalarını doğrula
        run: flutter create --platforms=android --org com.cemilkorkmaz .
      - run: flutter pub get
      - name: Anahtarsız canlı fiyat kaynağını doğrula
        run: python3 tool/check_price_source.py
      - name: Android release APK derlemesi
        run: |
          set +e
          flutter build apk --release > android-build.log 2>&1
          status=$?
          cat android-build.log
          if [ $status -ne 0 ]; then
            python3 -c 'from pathlib import Path; text=Path("android-build.log").read_text(); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit $status
      - name: Google Play AAB derlemesini doğrula
        run: flutter build appbundle --release
      - name: APK dosyasını adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk altin-defterim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: altin-defterim-android-apk
          path: altin-defterim.apk
      - name: İndirilebilir Android test sürümü
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: Altın Defterim Android 1.0.0
          prerelease: true
          body: |
            Android 7.0 ve üzeri için test APK'sı.
            Bilinmeyen uygulamalara izin vererek APK'yı kurabilirsiniz.
            Bu sürüm test amaçlıdır; gerçek alım/satım yapmaz.
          files: altin-defterim.apk

  ios-build:
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: iOS proje dosyalarını doğrula
        run: flutter create --platforms=ios --org com.cemilkorkmaz .
      - run: flutter pub get
      - name: iOS derlemesi (imzasız)
        run: flutter build ios --release --no-codesign

  store-screenshots:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Mağaza ekran görüntülerini üret
        run: |
          set +e
          GENERATE_STORE_SCREENSHOTS=1 flutter test --update-goldens test/store_screenshots_test.dart > shots.log 2>&1
          status=$?
          tail -120 shots.log
          if [ $status -ne 0 ]; then
            python3 -c 'from pathlib import Path; text="\n".join(Path("shots.log").read_text().splitlines()[-40:]); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit $status
      - name: Üretilen görselleri doğrula
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files = sorted(Path("store/screenshots").glob("*.png"))
          if len(files) < 8:
              raise SystemExit(f"Beklenen 8 görsel, bulunan {len(files)}")
          for f in files:
              data = f.read_bytes()
              w, h = struct.unpack(">II", data[16:24])
              ratio = w / h
              size_mb = len(data) / 1024 / 1024
              ok = (max(w, h) <= 3840 and min(w, h) >= 320) and abs(ratio - 9 / 16) < 0.001 and size_mb < 8
              print(f"{f.name}: {w}x{h} {size_mb:.2f} MB {'OK' if ok else 'GECERSIZ'}")
              if not ok:
                  raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: altin-defterim-store-screenshots
          path: store/screenshots/*.png
      - name: Görselleri dala işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/screenshots
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Mağaza ekran görüntülerini güncelle"
            git push
          fi
